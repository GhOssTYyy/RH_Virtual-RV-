<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-in and Log-in</title>
    <link rel="stylesheet" href="css/sign-in.css">
</head>

<body>
    <main class="container">
        <form>

            <img src="assets/icons/arrow_back_page.svg" alt="" id="arrow-back-page">

            <h1 id="titulo">
                Sign-in
            </h1>

            <div class="input-box">
                <input id="email-content" type="email" placeholder="Email">

            </div>

            <div class="input-box">
                <input type="password" placeholder="Password" id="password-content-1">
                <img src="assets/icons/eye_closed.svg" alt="" id="password-eye-1" class="password-eye">
            </div>

                <div class="input-box">
                <input type="password" placeholder="Re-Password" id="password-content-2">
                <img src="assets/icons/eye_closed.svg" alt="" id="password-eye-2" class="password-eye">
            </div>

            <div class="remember">
                <label>
                <input type="checkbox">
                Keep me logged in
                </label>
                <a href="">Forgot my password</a>
            </div>

            <button id="register-account" class="login" type="submit">Register</button>
            
        </form>
    </main> 
    
    <script type="module" src="js/employees/sign-in.js"></script>

</body>
</html>
