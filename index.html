<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-in and Log-in</title>
    <link rel="stylesheet" href="css/log-in.css">
</head>

<body>

    <main class="container">
        <form>

            <img src="assets/icons/light_mode_icon.svg" alt="" id="dark-mode-button">

            <h1 id="title">Login</h1>

            <div class="input-box">
                <input id="email-content" type="email" placeholder="Email" required>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Senha" id="password-content" required>
                <img src="assets/icons/eye_closed.svg" alt="" id="password-eye">
            </div>

            <div class="remember">

                <label>
                <input type="checkbox">
            Manter-se logado
                </label>
                <a href="">Esqueci Minha Senha</a>

            </div>

            <button id="login-button" class="login" type="submit">Entrar</button>

            <div class="register-link">
                <p>Não tem uma conta? <a id="go-to-sign-html" href="">Criar Conta</a></p>

            </div>

        </form>

    </main> 

    <script type="module" src="js/employees/log-in.js"></script>
    
</body>

</html>
