<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-in and Log-in</title>
    <link rel="stylesheet" href="sign-in.css">
</head>

<body>
    <main class="container">
        <form>

            <img src="icons/arrow_back_page.svg" alt="" id="arrow-back-page">

            <h1 id="titulo">
                Sign-in
            </h1>

            <div class="input-box">
                <input type="email" placeholder="Email">

            </div>

            <div class="input-box">
                <input type="password" placeholder="Password" id="password-content-1">
                <img src="icons/eye_closed.svg" alt="" id="password-eye-1" class="password-eye">
            </div>

                <div class="input-box">
                <input type="password" placeholder="Re-Password" id="password-content-2">
                <img src="icons/eye_closed.svg" alt="" id="password-eye-2" class="password-eye">
            </div>

            <div class="remember">
                <label>
                <input type="checkbox">
                Keep me logged in
                </label>
                <a href="">Forgot my password</a>
            </div>

            <button class="login"  type="submit">Login</button>
            
            <script src="./js/main2.js"></script>
            <script src="./js/main3.js"></script>
            <script src="./js/back.js"></script>

        </form>
    </main> 
    
    <script src="sign-in.js"></script>

</body>
</html>
