<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - RH Virtual</title>
</head>

<body>

    <main class="container">
        <form id="forgot-password-form">

            <!-- Voltar para o login -->
            <a href="/index.html" class="back-link">← Voltar para o login</a>

            <!-- Ícone -->
            <div class="icon">🔑</div>

            <!-- Título -->
            <h1>Recuperar Senha</h1>

            <!-- Descrição -->
            <p class="description">
                Digite seu email abaixo. Enviaremos um link para você criar uma nova senha.
            </p>

            <!-- Campo de email -->
            <div class="input-box">
                <label for="email-content">Email</label>
                <input 
                    type="email" 
                    id="email-content" 
                    placeholder="seu@email.com"
                    required
                >
            </div>

            <!-- Botão -->
            <button type="submit" id="send-button" class="send-button">
                <span id="button-text">Enviar Link de Recuperação</span>
            </button>

            <!-- Mensagem de feedback -->
            <div id="message" class="message"></div>

        </form>
    </main>

    <script type="module" src="/js/employees/forgot_password.js"></script>

</body>
</html>
