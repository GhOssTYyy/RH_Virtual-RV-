<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RH Virtual - Início</title>
    <link rel="stylesheet" href="/css/main-page.css">
</head>
<body>


    <header class="header">
        
        <div class="header-welcome">
            <h1 id="welcome-name">👋 Olá!</h1>
            <p>Bem-vindo ao RH Virtual</p>
        </div>
        
        <div class="header-actions">
            
            <button class="settings-button" id="settings-button" title="Configurações">
                ⚙️
            </button>
            
            <div class="profile-picture" id="profile-picture" title="Meu perfil">
                👤
            </div>
            
        </div>
        
    </header>

    <main class="main-content">
        
        <div class="welcome-section">
            <h2>🏠 Início</h2>
            <p>Bem-vindo ao seu painel de RH Virtual</p>
            <p>Use a navegação abaixo para acessar as funcionalidades</p>
        </div>

    </main>

    <nav class="bottom-tabs">
        
        <button class="tab active" data-tab="home">
            <span class="tab-icon">🏠</span>
            <span class="tab-label">Início</span>
        </button>

        <button class="tab" data-tab="point">
            <span class="tab-icon">⏰</span>
            <span class="tab-label">Ponto</span>
        </button>

        <button class="tab" data-tab="holiday">
            <span class="tab-icon">🌴</span>
            <span class="tab-label">Férias</span>
        </button>

        <button class="tab" data-tab="profile">
            <span class="tab-icon">👤</span>
            <span class="tab-label">Perfil</span>
        </button>

        <button class="tab tab-rh" data-tab="rh" id="tab-rh" style="display: none;">
            <span class="tab-icon">📊</span>
            <span class="tab-label">RH</span>
        </button>

    </nav>

    <script type="module" src="/js/auto_guard.js"></script>
    <script type="module" src="/js/employees/main_page.js"></script>

</body>
</html>
