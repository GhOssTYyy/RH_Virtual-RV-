<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Pontos - RH Virtual</title>
    <link rel="stylesheet" href="/css/employees/historic-clock-in-register.css">
    <link rel="stylesheet" href="/css/employees/clock-in-adjust.css">
</head>

<body>

    <header class="header">
        <button class="header-back" id="header-back-button">
            <img src="" alt="⬅️" class="header-back-icon" onerror="this.replaceWith('⬅️')">
        </button>
        <h1 class="header-title">Histórico de Pontos</h1>
        <div class="header-spacer"></div>
    </header>

    <main class="main-content">

        <!-- Dropdown de ANO -->
        <div class="year-selector-wrapper">
            <label for="year-selector" class="year-selector-label">
                <span class="year-selector-icon">
                    <img src="" alt="📅" class="label-icon" onerror="this.replaceWith('📅')">
                </span>
                <span>Ano</span>
            </label>
            <div class="year-selector-container">
                <select id="year-selector" class="year-selector">
                </select>
                <span class="year-selector-arrow">▾</span>
            </div>
        </div>

        <!-- Abas de MÊS -->
        <div class="month-tabs" id="month-tabs"></div>

        <!-- Título do mês ativo -->
        <div class="active-month-title" id="active-month-title">
            Carregando...
        </div>

        <!-- Container dos registros -->
        <div id="historic-clock-in-register-container">
            <p class="carregando">Carregando Histórico...</p>
        </div>

        <!-- Botão "Adicionar ponto esquecido" -->
        <button class="adjust-add-button" id="adjust-add-button">
            <span class="adjust-add-button-icon">➕</span>
            <span>Adicionar ponto esquecido</span>
        </button>

        <!-- Botão "Meus ajustes" -->
        <button class="adjust-add-button" id="adjust-my-requests-button">
            <span class="adjust-add-button-icon">📋</span>
            <span>Meus ajustes</span>
        </button>

    </main>

    <nav class="bottom-tabs">
        <button class="tab" data-tab="home">
            <img src="" alt="🏠" class="tab-icon-img" onerror="this.replaceWith('🏠')">
            <span class="tab-label">Início</span>
        </button>
        <button class="tab" data-tab="point">
            <img src="" alt="⏰" class="tab-icon-img" onerror="this.replaceWith('⏰')">
            <span class="tab-label">Ponto</span>
        </button>
        <button class="tab active" data-tab="historic">
            <img src="" alt="📊" class="tab-icon-img" onerror="this.replaceWith('📊')">
            <span class="tab-label">Histórico</span>
        </button>
        <button class="tab" data-tab="holiday">
            <img src="" alt="🌴" class="tab-icon-img" onerror="this.replaceWith('🌴')">
            <span class="tab-label">Férias</span>
        </button>
        <button class="tab tab-rh" data-tab="rh" id="tab-rh" style="display: none;">
            <img src="" alt="📈" class="tab-icon-img" onerror="this.replaceWith('📈')">
            <span class="tab-label">RH</span>
        </button>
    </nav>

    <script type="module" src="/js/auto_guard.js"></script>
    <script type="module" src="/js/RH/rh_tab_guard.js"></script>
    <script type="module" src="/js/employees/historic_clock_in_register.js"></script>

</body>

</html>
