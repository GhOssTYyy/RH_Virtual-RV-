<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Férias e Days Off - RH Virtual</title>
    <link rel="stylesheet" href="/css/employees/holiday-day-off.css">
</head>

<body>

    <header class="header">
        <button class="header-back" id="header-back-button">
            <img src="/assets/icons/arrow_back_page.svg" alt="⬅️" class="header-back-icon" onerror="this.replaceWith('⬅️')">
        </button>
        <h1 class="header-title">Férias e Days Off</h1>
        <div class="header-spacer"></div>
    </header>

    <main class="main-content">
        
        <div class="placeholder-card">
            <div class="placeholder-icon">
                <img src="" alt="🌴" class="placeholder-img" onerror="this.replaceWith('🌴')">
            </div>
            <h2 class="placeholder-title">Em breve</h2>
            <p class="placeholder-text">
                A funcionalidade de Férias e Days Off está em desenvolvimento.
            </p>
        </div>

    </main>

    <!-- Menu Inferior -->
    <nav class="bottom-tabs">
        
        <button class="tab" data-tab="home">
            <img src="/assets/icons/home-button-icon.svg" alt="🏠" class="tab-icon-img" onerror="this.replaceWith('🏠')">
            <span class="tab-label">Início</span>
        </button>

        <button class="tab" data-tab="point">
            <img src="/assets/icons/clock-in-button-icon.svg" alt="⏰" class="tab-icon-img" onerror="this.replaceWith('⏰')">
            <span class="tab-label">Ponto</span>
        </button>

        <button class="tab" data-tab="historic">
            <img src="/assets/icons/bar-chart-icon.svg" alt="📊" class="tab-icon-img" onerror="this.replaceWith('📊')">
            <span class="tab-label">Histórico</span>
        </button>

        <button class="tab active" data-tab="holiday">
            <img src="/assets/icons/flight_button_icon.svg" alt="🌴" class="tab-icon-img" onerror="this.replaceWith('🌴')">
            <span class="tab-label">Férias</span>
        </button>

    </nav>

    <script type="module" src="/js/auto_guard.js"></script>
    <script type="module" src="/js/employees/holiday_day_off.js"></script>

</body>

</html>
