<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do RH - RH Virtual</title>
    <link rel="stylesheet" href="/css/RH/rh-dashboard.css">
    <link rel="icon" type="image/svg+xml" href="/assets/icons/logo-icon.svg.svg">
</head>

<body>

    <header class="header">
        <button class="header-back" id="header-back-button">
            <img src="/assets/icons/arrow-left.svg" alt="⬅️" class="header-back-icon" onerror="this.replaceWith('⬅️')">
        </button>
        <div class="header-title">
            <h1>Painel do RH</h1>
            <p>Visão geral dos registros de ponto</p>
        </div>
        <button class="logout-button" id="logout-button">Sair</button>
    </header>

    <section class="filtros">
        <div class="filtro-group">
            <label for="filtro-funcionario">Funcionário:</label>
            <select id="filtro-funcionario">
                <option value="todos">Todos</option>
            </select>
        </div>

        <div class="filtro-group">
            <label for="filtro-data">Data:</label>
            <input type="date" id="filtro-data">
        </div>

        <div class="filtro-buttons">
            <button id="btn-buscar" class="btn-primary">Buscar</button>
            <button id="btn-limpar" class="btn-secondary">Limpar</button>
        </div>
    </section>

    <main class="main-content">

        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">
                    <img src="/assets/icons/bar-chart-icon.svg" alt="📊" class="stat-icon-img" onerror="this.replaceWith('📊')">
                </div>
                <div class="stat-info">
                    <span class="stat-number" id="total-registros">0</span>
                    <span class="stat-label">Registros</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <img src="/assets/icons/users_icon.svg" alt="👥" class="stat-icon-img" onerror="this.replaceWith('👥')">
                </div>
                <div class="stat-info">
                    <span class="stat-number" id="total-funcionarios">0</span>
                    <span class="stat-label">Funcionários</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <img src="/assets/icons/bolt_icon.svg" alt="⚡" class="stat-icon-img" onerror="this.replaceWith('⚡')">
                </div>
                <div class="stat-info">
                    <span class="stat-number" id="total-extras">0</span>
                    <span class="stat-label">Com Extras</span>
                </div>
            </div>
        </section>

        <section class="tabela-container">
            <h2>Registros de Ponto</h2>

            <div class="tabela-wrapper">
                <table class="tabela">
                    <thead>
                        <tr>
                            <th>Funcionário</th>
                            <th>Data</th>
                            <th>Entrada</th>
                            <th>Almoço</th>
                            <th>Volta</th>
                            <th>Saída</th>
                            <th>Horas</th>
                            <th>Extras</th>
                            <th>Local</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-tabela">
                        <tr>
                            <td colspan="9" class="carregando">Carregando...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="tabela-footer">
                <span id="info-total">0 registros</span>
                <button id="btn-exportar" class="btn-primary">
                    <img src="/assets/icons/download_icon.svg" alt="📥" class="btn-icon" onerror="this.replaceWith('📥')">
                    <span>Exportar Planilha</span>
                </button>
            </div>
        </section>

    </main>

    <nav class="bottom-tabs">
        
        <button class="tab" data-tab="home">
            <img src="/assets/icons/home-button-icon.svg" alt="🏠" class="tab-icon-img" onerror="this.replaceWith('🏠')">
            <span class="tab-label">Home</span>
        </button>

        <button class="tab active" data-tab="dashboard">
            <img src="/assets/icons/bar-chart-icon.svg" alt="📊" class="tab-icon-img" onerror="this.replaceWith('📊')">
            <span class="tab-label">Dashboard</span>
        </button>

        <button class="tab" data-tab="approvals" id="tab-approvals">
            <img src="/assets/icons/check_icon.svg" alt="✅" class="tab-icon-img" onerror="this.replaceWith('✅')">
            <span class="tab-label">Aprovações</span>
            <span class="tab-badge" id="tab-approvals-badge" style="display: none;">0</span>
        </button>

    </nav>

    <script type="module" src="/js/RH/rh_dashboard.js"></script>

</body>
</html>
