<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprovações - Painel do RH</title>
    <link rel="stylesheet" href="/css/RH/rh-approvals.css">
</head>

<body>

<header class="header">
    <button class="header-back" id="header-back-button">
        <img src="/assets/icons/arrow_back_page.svg" alt="Voltar" class="header-back-icon" onerror="this.replaceWith('⬅️')">
    </button>
    <h1 class="header-title">Aprovações</h1>
    <div class="header-badge empty" id="header-badge">0</div>
</header>

    <main class="main-content">

        <div class="filters-container" id="filters-container">
            <button class="filter-btn active" data-filter="pending">
                <img src="/assets/icons/time_icon.svg" alt="" class="filter-icon" onerror="this.replaceWith('⏳')">
                Pendentes
            </button>
            <button class="filter-btn" data-filter="approved">
                <img src="/assets/icons/check_icon.svg" alt="" class="filter-icon" onerror="this.replaceWith('✅')">
                Aprovados
            </button>
            <button class="filter-btn" data-filter="rejected">
                <img src="/assets/icons/close_icon.svg" alt="" class="filter-icon" onerror="this.replaceWith('❌')">
                Reprovados
            </button>
            <button class="filter-btn" data-filter="all">
                <img src="/assets/icons/content_paste_icon.svg" alt="" class="filter-icon" onerror="this.replaceWith('📋')">
                Todos
            </button>
        </div>
        <div id="adjustments-container">
            <div class="empty-state">
                <div class="empty-state-icon"></div>
                <img src="/assets/icons/time_icon.svg" alt="" class="filter-icon" onerror="this.replaceWith('⏳')">
                <div class="empty-state-title">Carregando...</div>
            </div>
        </div>

    </main>

    <nav class="bottom-tabs">
        <button class="tab" data-tab="home">
            <img src="/assets/icons/home-button-icon.svg" alt="Home" class="tab-icon-img" onerror="this.replaceWith('🏠')">
            <span class="tab-label">Home</span>
        </button>
        <button class="tab" data-tab="dashboard">
            <img src="/assets/icons/bar-chart-icon.svg" alt="Dashboard" class="tab-icon-img" onerror="this.replaceWith('📊')">
            <span class="tab-label">Dashboard</span>
        </button>
        <button class="tab active" data-tab="approvals">
            <img src="/assets/icons/check_icon.svg" alt="Aprovações" class="tab-icon-img" onerror="this.replaceWith('✅')">
            <span class="tab-label">Aprovações</span>
        </button>
    </nav>

    <script type="module" src="/js/RH/rh_approvals.js"></script>

</body>
</html>
