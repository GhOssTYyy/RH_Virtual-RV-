<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprovações - Painel do RH</title>
    <link rel="stylesheet" href="/css/RH/rh-approvals.css">
</head>

<body>

    <header class="header">
        <button class="header-back" id="header-back-button">‹</button>
        <h1 class="header-title">Aprovações</h1>
        <div class="header-badge empty" id="header-badge">0</div>
    </header>

    <main class="main-content">

        <div class="filters-container" id="filters-container">
            <button class="filter-btn active" data-filter="pending">⏳ Pendentes</button>
            <button class="filter-btn" data-filter="approved">✅ Aprovados</button>
            <button class="filter-btn" data-filter="rejected">❌ Reprovados</button>
            <button class="filter-btn" data-filter="all">📋 Todos</button>
        </div>

        <div id="adjustments-container">
            <div class="empty-state">
                <div class="empty-state-icon">⏳</div>
                <div class="empty-state-title">Carregando...</div>
            </div>
        </div>

    </main>

    <nav class="bottom-tabs">
        <button class="tab" data-tab="dashboard">
            <span class="tab-icon">📊</span>
            <span class="tab-label">Dashboard</span>
        </button>
        <button class="tab active" data-tab="approvals">
            <span class="tab-icon">✅</span>
            <span class="tab-label">Aprovações</span>
        </button>
        <button class="tab" data-tab="employees">
            <span class="tab-icon">👥</span>
            <span class="tab-label">Funcionários</span>
        </button>
        <button class="tab" data-tab="settings">
            <span class="tab-icon">⚙️</span>
            <span class="tab-label">Config.</span>
        </button>
        <button class="tab" data-tab="back">
            <span class="tab-icon">🏠</span>
            <span class="tab-label">Voltar</span>
        </button>
    </nav>

    <script type="module" src="/js/RH/rh_approvals.js"></script>

</body>
</html>
